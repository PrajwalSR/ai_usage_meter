name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: ./build-app.sh
      - name: Run the tests
        run: ./scripts/run-tests.sh
